{{ $href := .Get "href" | default "#" }}
{{ $style := .Get "style" | default "primary" }}
{{ $size := .Get "size" }}
{{ $target := .Get "target" }}
{{ $icon := .Get "icon" }}
<a href="{{ $href }}" class="btn btn-{{ $style }}{{ if $size }} btn-{{ $size }}{{ end }}"{{ with $target }} target="{{ . }}" rel="noopener"{{ end }}>
  {{ if $icon }}<span class="btn-icon">{{ $icon }}</span>{{ end }}{{ .Inner }}
</a>
